    <h1>Three ways GABA can inhibit</h1>
    <p class="intro">Voltage direction alone does not tell you how a neuron will respond.</p>
  </header>
  <nav class="controls" aria-label="Diagram controls"><a id="download" href="output/gaba-inhibition.svg" download>Download SVG</a></nav>
  <figure>
    <div id="diagram"></div>
    <figcaption>GABA<sub>A</sub> signaling can move membrane voltage farther from threshold, weaken excitatory input through shunting, or depolarize a neuron while still reducing its likelihood of firing. The last case illustrates conditions where shunting outweighs the depolarization; depolarizing GABA can be excitatory in other conditions.</figcaption>
  </figure>
