<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="diagram-title diagram-description" lang="fr" xml:lang="fr">
  <title id="diagram-title">Carte causale du cône de lumière centrée sur l’événement O</title>
  <desc id="diagram-description">Diagramme d’un espace-temps plat avec le temps sur l’axe vertical et une dimension spatiale sur l’axe horizontal, centré sur l’événement choisi O. Le cône supérieur ombré est le futur causal de O et contient F, qui présente une séparation temporelle et pourrait être affecté par O. Le cône inférieur ombré est le passé causal de O et contient P, qui présente une séparation temporelle et aurait pu affecter O. Quatre rayons lumineux diagonaux forment les frontières de type lumière ; L se trouve exactement sur la frontière supérieure droite. S se trouve dans la région droite de genre espace, hors du cône, et présente une séparation spatiale par rapport à O. Les axes ont la même échelle afin que la lumière se déplace à 45 degrés, dans des unités où c est égal à 1.</desc>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#304452" />
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .axis { fill: none; stroke: #304452; stroke-width: 3; stroke-linecap: round; }
      .axis-label { fill: #263946; font-size: 27px; font-weight: 600; }
      .axis-symbol { font-size: 31px; font-style: italic; }
      .exterior-fill { fill: #e4ded3; fill-opacity: 0.68; }
      .cone-fill { fill: #78b5c5; fill-opacity: 0.22; }
      .cone-boundary { fill: none; stroke: #28758a; stroke-width: 6; stroke-linecap: round; }
      .region-title { fill: #2b6171; font-size: 24px; font-weight: 760; letter-spacing: 0.075em; }
      .region-detail { fill: #4f6f79; font-size: 20px; font-weight: 500; }
      .exterior-title { fill: #647573; font-size: 18px; font-weight: 750; letter-spacing: 0.07em; }
      .exterior-detail { fill: #6f7e7b; font-size: 17px; font-weight: 500; }
      .boundary-label { fill: #245f72; font-size: 19px; font-weight: 650; }
      .boundary-detail { fill: #58747c; font-size: 17px; font-weight: 500; }
      .boundary-leader { fill: none; stroke: #6f929b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .event-example circle { fill: #fffdfa; stroke: #2c6f82; stroke-width: 4; }
      .event-letter { fill: #173b48; font-size: 23px; font-weight: 800; }
      .event-label { fill: #263f4b; font-size: 20px; font-weight: 700; }
      .event-detail { fill: #62747c; font-size: 17px; font-weight: 500; }
      .event-o .halo { fill: #fbf8f1; stroke: #263946; stroke-width: 2.5; }
      .event-o .core { fill: #c76543; }
      .o-letter { fill: #fff; font-size: 23px; font-weight: 800; }
      .chosen-label { fill: #7c3f2c; font-size: 19px; font-weight: 750; }
      .note { fill: #62727a; font-size: 17px; font-weight: 500; }
      .note-rule { stroke: #aeb9b7; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="#fbf8f1" />

  <g aria-label="Régions causales par rapport à l’événement O">
    <path class="exterior-fill" d="M 110 90 L 330 90 L 720 480 L 330 870 L 110 870 Z" />
    <path class="exterior-fill" d="M 1330 90 L 1110 90 L 720 480 L 1110 870 L 1330 870 Z" />
    <path class="cone-fill" d="M 330 90 L 720 480 L 1110 90 Z" />
    <path class="cone-fill" d="M 720 480 L 330 870 L 1110 870 Z" />
  </g>

  <g aria-label="Axes de l’espace-temps">
    <path class="axis" d="M 110 480 L 1330 480" marker-end="url(#axis-arrow)" />
    <path class="axis" d="M 720 885 L 720 70" marker-end="url(#axis-arrow)" />
    <text class="axis-label" x="1305" y="528" text-anchor="end">Position, <tspan class="axis-symbol">x</tspan></text>
    <text class="axis-label" x="750" y="82">Temps, <tspan class="axis-symbol">t</tspan></text>
  </g>

  <g aria-label="Rayons lumineux et frontière du cône de lumière">
    <path class="cone-boundary" d="M 330 90 L 720 480 L 1110 90" />
    <path class="cone-boundary" d="M 330 870 L 720 480 L 1110 870" />
    <path class="boundary-leader" d="M 340 218 L 405 218 L 444 204" />
    <text class="boundary-label" x="175" y="184">Rayons lumineux</text>
    <text class="boundary-detail" x="175" y="212">frontière du cône</text>
  </g>

  <g>
    <text class="region-title" x="570" y="160" text-anchor="middle">FUTUR CAUSAL</text>
    <text class="region-detail" x="570" y="191" text-anchor="middle">Influence possible depuis O</text>
    <text class="region-title" x="850" y="744" text-anchor="middle">PASSÉ CAUSAL</text>
    <text class="region-detail" x="850" y="775" text-anchor="middle">Influence possible sur O</text>

    <text class="exterior-title" x="165" y="356">RÉGION DE GENRE ESPACE</text>
    <text class="exterior-detail" x="165" y="384">Aucun lien causal avec O</text>
    <text class="exterior-title" x="1035" y="356">RÉGION DE GENRE ESPACE</text>
    <text class="exterior-detail" x="1035" y="384">Aucun lien causal avec O</text>
  </g>

  <g aria-label="Événements exemples et leur séparation par rapport à O">
    <g class="event-example" transform="translate(755 195)">
      <circle r="13" />
      <text class="event-letter" x="0" y="8" text-anchor="middle">F</text>
      <text class="event-label" x="33" y="-6">intervalle temporel</text>
      <text class="event-detail" x="33" y="19">O pourrait l’affecter</text>
    </g>

    <g class="event-example" transform="translate(660 790)">
      <circle r="13" />
      <text class="event-letter" x="0" y="8" text-anchor="middle">P</text>
      <text class="event-label" x="-30" y="-7" text-anchor="end">intervalle temporel</text>
      <text class="event-detail" x="-30" y="18" text-anchor="end">aurait pu affecter O</text>
    </g>

    <g class="event-example" transform="translate(1040 160)">
      <circle r="13" />
      <text class="event-letter" x="0" y="8" text-anchor="middle">L</text>
      <text class="event-label" x="38" y="-6">séparation de type lumière</text>
      <text class="event-detail" x="38" y="19">sur la frontière</text>
    </g>

    <g class="event-example" transform="translate(1080 600)">
      <circle r="13" />
      <text class="event-letter" x="0" y="8" text-anchor="middle">S</text>
      <text class="event-label" x="30" y="-6">séparation spatiale</text>
      <text class="event-detail" x="30" y="19">hors du cône</text>
    </g>

    <g class="event-o" transform="translate(720 480)">
      <circle class="halo" r="25" />
      <circle class="core" r="19" />
      <text class="o-letter" x="0" y="8" text-anchor="middle">O</text>
    </g>
    <path class="boundary-leader" d="M 645 439 L 669 439 L 688 457" />
    <text class="chosen-label" x="625" y="445" text-anchor="end">Événement choisi</text>
  </g>

  <g>
    <path class="note-rule" d="M 275 912 L 1165 912" />
    <text class="note" x="720" y="938" text-anchor="middle">Échelles égales et c = 1 placent les rayons lumineux à 45°. Une dimension spatiale est montrée ; les autres sont comprimées.</text>
  </g>
</svg>