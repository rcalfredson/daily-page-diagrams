<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1140" viewBox="0 0 700 1140" role="img" aria-labelledby="diagram-title diagram-description" lang="en" xml:lang="en">
<title id="diagram-title">What changes when DNA is methylated?</title>
<desc id="diagram-description">Panel A compares the cytosine and 5-methylcytosine bases in DNA. Both have oxygen at carbon 2, an amino group at carbon 4, and a connection from nitrogen 1 to DNA sugar. Only 5-methylcytosine has a CH3 group at carbon 5. Panel B shows the top strand 5′-ATCGAT-3′ paired with the bottom strand 3′-TAGCTA-5′. The top cytosine has a methyl group and still pairs with guanine. CpG marks adjacent cytosine and guanine on the same strand, linked by phosphate. Only one strand is shown methylated. The nucleotide sequence remains unchanged.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#263746"/></marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #263746; }
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 36px; }
    .heading { font-size: 28px; font-weight: 700; }
    .body { font-size: 26px; }
    .small { font-size: 24px; fill: #52646d; }
    .atom { font-size: 32px; }
    .methyl { fill: #a94829; font-weight: 700; }
    .position { font-size: 23px; fill: #28758a; font-weight: 700; }
    .bond { stroke: #263746; stroke-width: 3; stroke-linecap: round; }
    .methyl-bond { stroke: #a94829; stroke-width: 3; stroke-linecap: round; }
    .rule { stroke: #c4cdc9; stroke-width: 1.5; }
    .backbone { stroke: #73878b; stroke-width: 4; }
    .pair { stroke: #73878b; stroke-width: 2.5; stroke-dasharray: 3 5; }
    .base { fill: #fbf8f1; stroke: #73878b; stroke-width: 2; }
    .modified { fill: #f9e5dc; stroke: #a94829; stroke-width: 3; }
    .base-letter { font-size: 34px; font-weight: 700; }
    .bracket { fill: none; stroke: #28758a; stroke-width: 2.5; }
  </style>
</defs>
<rect width="700" height="1140" fill="#fbf8f1"/>
<text x="36" y="57" class="title" text-anchor="start">What Changes When</text>
<text x="36" y="100" class="title" text-anchor="start">DNA Is Methylated?</text>
<line x1="36" y1="128" x2="664" y2="128" class="rule"/>
<g aria-label="A. The molecular modification">
  <text x="36" y="174" class="position" text-anchor="start">A</text><text x="72" y="174" class="heading" text-anchor="start">A small chemical addition</text>
  <g transform="translate(185 335)" aria-label="Cytosine base attached to DNA sugar">
      <line x1="-14" y1="62" x2="-61" y2="35" class="bond"/><line x1="-61" y1="35" x2="-61" y2="-18" class="bond"/>
      <line x1="-48" y1="-43" x2="0" y2="-70" class="bond"/><line x1="-43" y1="-34" x2="-1" y2="-58" class="bond"/>
      <line x1="0" y1="-70" x2="61" y2="-35" class="bond"/><line x1="61" y1="-35" x2="61" y2="35" class="bond"/><line x1="50" y1="-28" x2="50" y2="28" class="bond"/>
      <line x1="61" y1="35" x2="14" y2="62" class="bond"/>
      <line x1="-63" y1="31" x2="-102" y2="54" class="bond"/><line x1="-57" y1="41" x2="-96" y2="64" class="bond"/>
      <line x1="0" y1="-70" x2="0" y2="-104" class="bond"/><line x1="0" y1="85" x2="0" y2="110" class="bond"/>
      <text x="-61" y="-25" class="atom" text-anchor="middle">N</text>
      <text x="0" y="80" class="atom" text-anchor="middle">N</text>
      <text x="-116" y="77" class="atom" text-anchor="middle">O</text>
      <text x="0" y="-116" class="atom" text-anchor="middle">NH₂</text>
      <text x="0" y="139" class="small" text-anchor="middle">to DNA sugar</text>
      <text x="39" y="-14" class="position" text-anchor="middle">5</text>
      
    </g><g transform="translate(480 335)" aria-label="5-methylcytosine base attached to DNA sugar">
      <line x1="-14" y1="62" x2="-61" y2="35" class="bond"/><line x1="-61" y1="35" x2="-61" y2="-18" class="bond"/>
      <line x1="-48" y1="-43" x2="0" y2="-70" class="bond"/><line x1="-43" y1="-34" x2="-1" y2="-58" class="bond"/>
      <line x1="0" y1="-70" x2="61" y2="-35" class="bond"/><line x1="61" y1="-35" x2="61" y2="35" class="bond"/><line x1="50" y1="-28" x2="50" y2="28" class="bond"/>
      <line x1="61" y1="35" x2="14" y2="62" class="bond"/>
      <line x1="-63" y1="31" x2="-102" y2="54" class="bond"/><line x1="-57" y1="41" x2="-96" y2="64" class="bond"/>
      <line x1="0" y1="-70" x2="0" y2="-104" class="bond"/><line x1="0" y1="85" x2="0" y2="110" class="bond"/>
      <text x="-61" y="-25" class="atom" text-anchor="middle">N</text>
      <text x="0" y="80" class="atom" text-anchor="middle">N</text>
      <text x="-116" y="77" class="atom" text-anchor="middle">O</text>
      <text x="0" y="-116" class="atom" text-anchor="middle">NH₂</text>
      <text x="0" y="139" class="small" text-anchor="middle">to DNA sugar</text>
      <text x="39" y="-14" class="position" text-anchor="middle">5</text>
      <line x1="61" y1="-35" x2="111" y2="-64" class="methyl-bond"/><text x="139" y="-68" class="methyl atom" text-anchor="middle">CH₃</text>
    </g>
  <path d="M285 335H372" class="bond" marker-end="url(#arrow)"/>
  <text x="329" y="304" class="small" text-anchor="middle">DNMT</text>
  <text x="185" y="517" class="body" text-anchor="middle">Cytosine</text>
  <text x="480" y="517" class="body" text-anchor="middle">5-methylcytosine</text>
  <text x="36" y="558" class="small" text-anchor="start">5 = carbon 5 of the ring</text>
  <text x="36" y="591" class="small" text-anchor="start">DNMT = DNA methyltransferase enzyme</text>
</g>
<line x1="36" y1="619" x2="664" y2="619" class="rule"/>
<g aria-label="B. Methylation within DNA, schematic">
  <text x="36" y="664" class="position" text-anchor="start">B</text><text x="72" y="664" class="heading" text-anchor="start">The same DNA sequence</text>
  <text x="350" y="706" class="small" text-anchor="middle">CpG: C followed by G on one strand</text>
  <path d="M310 738V724H390V738" class="bracket"/>
  <text x="310" y="773" class="methyl atom" text-anchor="middle">CH₃</text>
  <line x1="310" y1="778" x2="310" y2="790" class="methyl-bond"/>
  <line x1="105" y1="816" x2="595" y2="816" class="backbone"/><line x1="105" y1="908" x2="595" y2="908" class="backbone"/>
  <line x1="150" y1="845" x2="150" y2="879" class="pair"/>
      <rect x="124" y="790" width="52" height="52" rx="8" class="base "/>
      <rect x="124" y="882" width="52" height="52" rx="8" class="base"/>
      <text x="150" y="828" class="base-letter" text-anchor="middle">A</text><text x="150" y="920" class="base-letter" text-anchor="middle">T</text><line x1="230" y1="845" x2="230" y2="879" class="pair"/>
      <rect x="204" y="790" width="52" height="52" rx="8" class="base "/>
      <rect x="204" y="882" width="52" height="52" rx="8" class="base"/>
      <text x="230" y="828" class="base-letter" text-anchor="middle">T</text><text x="230" y="920" class="base-letter" text-anchor="middle">A</text><line x1="310" y1="845" x2="310" y2="879" class="pair"/>
      <rect x="284" y="790" width="52" height="52" rx="8" class="base modified"/>
      <rect x="284" y="882" width="52" height="52" rx="8" class="base"/>
      <text x="310" y="828" class="base-letter" text-anchor="middle">C</text><text x="310" y="920" class="base-letter" text-anchor="middle">G</text><line x1="390" y1="845" x2="390" y2="879" class="pair"/>
      <rect x="364" y="790" width="52" height="52" rx="8" class="base "/>
      <rect x="364" y="882" width="52" height="52" rx="8" class="base"/>
      <text x="390" y="828" class="base-letter" text-anchor="middle">G</text><text x="390" y="920" class="base-letter" text-anchor="middle">C</text><line x1="470" y1="845" x2="470" y2="879" class="pair"/>
      <rect x="444" y="790" width="52" height="52" rx="8" class="base "/>
      <rect x="444" y="882" width="52" height="52" rx="8" class="base"/>
      <text x="470" y="828" class="base-letter" text-anchor="middle">A</text><text x="470" y="920" class="base-letter" text-anchor="middle">T</text><line x1="550" y1="845" x2="550" y2="879" class="pair"/>
      <rect x="524" y="790" width="52" height="52" rx="8" class="base "/>
      <rect x="524" y="882" width="52" height="52" rx="8" class="base"/>
      <text x="550" y="828" class="base-letter" text-anchor="middle">T</text><text x="550" y="920" class="base-letter" text-anchor="middle">A</text>
  <text x="64" y="827" class="body" text-anchor="middle">5′</text><text x="632" y="827" class="body" text-anchor="middle">3′</text>
  <text x="64" y="919" class="body" text-anchor="middle">3′</text><text x="632" y="919" class="body" text-anchor="middle">5′</text>
  <text x="350" y="977" class="body" text-anchor="middle">Modified C still pairs with G.</text>
  <text x="350" y="1013" class="small" text-anchor="middle">p = phosphate linking neighboring bases</text>
</g>
<line x1="36" y1="1042" x2="664" y2="1042" class="rule"/>
<text x="350" y="1082" class="body" text-anchor="middle">A methyl group is added.</text>
<text x="350" y="1117" class="body" text-anchor="middle">The DNA sequence stays the same.</text>
</svg>