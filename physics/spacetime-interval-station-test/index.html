      <header>

      <nav class="controls" aria-label="Diagram controls">
        <a id="download" download="spacetime-interval-station-test.svg">Download SVG</a>

      <figure>
        <div id="diagram"></div>
        <figcaption>A station 900,000 kilometers from a signal source records three possible alarm times. At two seconds the alarm is spacelike-separated from the emission, at three seconds it lies on the lightlike boundary, and at four seconds it is timelike-separated.</figcaption>
