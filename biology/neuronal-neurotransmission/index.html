<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How Neurons Pass a Signal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Daily Page biology diagrams</p>
        <h1>How neurons pass a signal</h1>
        <p class="intro">The signal changes form as it travels within and between neurons.</p>
      </header>

      <nav class="controls" aria-label="Diagram controls">
        <a id="download" download="neuronal-neurotransmission.svg">Download SVG</a>
      </nav>

      <figure>
        <div id="diagram"></div>
        <figcaption>A chemical input changes the membrane voltage of Neuron A. An electrical action potential travels along its axon, triggers chemical neurotransmitter release at the synapse, and changes the membrane voltage of Neuron B.</figcaption>
      </figure>
    </main>

    <script src="diagram.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
