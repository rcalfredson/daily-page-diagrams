<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Light Cones: Causal Map</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Daily Page physics diagrams</p>
        <h1>Light cones: a causal map</h1>
        <p class="intro">Which events can possibly affect one another in flat spacetime?</p>
      </header>

      <nav class="controls" aria-label="Diagram controls">
        <div class="control-group" aria-label="Language">
          <button type="button" data-language="en" aria-pressed="true">English</button>
          <button type="button" data-language="es" aria-pressed="false">Español</button>
          <button type="button" data-language="fr" aria-pressed="false">Français</button>
        </div>
        <a id="download" download="light-cone-causal-map.svg">Download SVG</a>
      </nav>

      <figure>
        <div id="diagram"></div>
        <figcaption>The light cone around event O. Time runs vertically and one spatial dimension runs horizontally; the omitted spatial directions are compressed for readability.</figcaption>
      </figure>
    </main>

    <script src="diagram.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
