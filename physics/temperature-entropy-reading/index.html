<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>T–s Diagram: Reading a Thermodynamic Process</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Daily Page physics diagrams</p>
        <h1>Reading a temperature–entropy diagram</h1>
        <p class="intro">One schematic figure, rendered in a clean or annotated state.</p>
      </header>

      <nav class="controls" aria-label="Diagram controls">
        <div class="control-group" aria-label="View">
          <button type="button" data-view="clean" aria-pressed="true">Clean</button>
          <button type="button" data-view="annotated" aria-pressed="false">Annotated</button>
        </div>
        <div class="control-group" aria-label="Language">
          <button type="button" data-language="en" aria-pressed="true">English</button>
          <button type="button" data-language="es" aria-pressed="false">Español</button>
          <button type="button" data-language="pt" aria-pressed="false">Português</button>
          <button type="button" data-language="ja" aria-pressed="false">日本語</button>
        </div>
        <a id="download" download="ts-reading-clean.svg">Download SVG</a>
      </nav>

      <figure>
        <div id="diagram"></div>
        <figcaption>
          Schematic geometry only; it does not represent a named thermodynamic cycle.
        </figcaption>
      </figure>
    </main>

    <script src="diagram.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
