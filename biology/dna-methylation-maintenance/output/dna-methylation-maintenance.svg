<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1740" viewBox="0 0 700 1740" role="img" aria-labelledby="diagram-title diagram-description" lang="en" xml:lang="en">
<title id="diagram-title">How Does DNA Methylation Survive Replication?</title>
<desc id="diagram-description">Canonical mammalian CpG maintenance, simplified into three stages. A: parental strand 1, 5′-ACGT-3′, pairs with parental strand 2, 3′-TGCA-5′. The top C and the bottom C in the neighboring column each carry CH3 and each pair with G. CpG runs in opposite physical directions on the two strands. B: semiconservative replication produces two daughters. Daughter 1 retains parental strand 1 on top and has a new lower strand. Daughter 2 has a new top strand and retains parental strand 2 below. Dark solid backbones identify parental strands; lighter dashed backbones identify new strands. Each daughter retains one original methyl group, while its new strand is initially unmethylated: hemimethylated DNA. C: UHRF1 helps recognize hemimethylated CpGs and recruit DNMT1. DNMT1 adds new methyl groups from a donor to cytosines on the new strands. Original marks stay on the parental strands; they are not transferred. Both daughter CpGs are now methylated on both strands. This illustrates how a pattern can be maintained, not perfect copying of every mark or all forms of DNA methylation.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#263746"/></marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #263746; }
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 36px; }
    .heading { font-size: 28px; font-weight: 700; }
    .body { font-size: 26px; }
    .small { font-size: 24px; fill: #52646d; }
    .position { font-size: 23px; fill: #28758a; font-weight: 700; }
    .base-letter { font-size: 30px; font-weight: 700; }
    .methyl { fill: #a94829; font-weight: 700; }
    .methyl-bond { stroke: #a94829; stroke-width: 3; stroke-linecap: round; }
    .backbone { stroke-width: 4; }
    .parental { stroke: #263746; }
    .new { stroke: #83999e; stroke-dasharray: 7 5; }
    .pair { stroke: #73878b; stroke-width: 2.5; stroke-dasharray: 3 5; }
    .base { fill: #fbf8f1; stroke-width: 2; }
    .parental-base { stroke: #263746; }
    .new-base { stroke: #83999e; fill: #edf1ef; }
    .modified { fill: #f9e5dc; stroke: #a94829; stroke-width: 3; }
    .rule { stroke: #c4cdc9; stroke-width: 1.5; }
    .flow { fill: none; stroke: #263746; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .cpg { fill: none; stroke: #28758a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .strong { font-weight: 700; }
  </style>
</defs>
<rect width="700" height="1740" fill="#fbf8f1"/>
<text x="36" y="57" class="title" text-anchor="start">How Does DNA Methylation</text>
<text x="36" y="100" class="title" text-anchor="start">Survive Replication?</text>
<line x1="36" y1="128" x2="664" y2="128" class="rule"/>
<g aria-label="Legend">
  <line x1="36" y1="166" x2="85" y2="166" class="backbone parental"/><text x="98" y="174" class="small" text-anchor="start">Parental strand</text>
  <line x1="366" y1="166" x2="415" y2="166" class="backbone new"/><text x="428" y="174" class="small" text-anchor="start">New strand</text>
  <text x="36" y="212" class="methyl small" text-anchor="start">CH₃</text><text x="98" y="212" class="small" text-anchor="start">Methyl group</text>
</g>
<g aria-label="A. Before DNA replication">
  <text x="36" y="262" class="position" text-anchor="start">A</text><text x="72" y="262" class="heading" text-anchor="start">Before DNA replication</text>
  <text x="350" y="302" class="body strong" text-anchor="middle">Fully methylated CpG</text>
  <text x="36" y="381" class="small" text-anchor="start">Parent 1</text><text x="36" y="461" class="small" text-anchor="start">Parent 2</text>
  <g id="parent-dna" aria-label="Both parental strands"><line x1="278" y1="393" x2="278" y2="427" class="pair"/><line x1="326" y1="393" x2="326" y2="427" class="pair"/><line x1="374" y1="393" x2="374" y2="427" class="pair"/><line x1="422" y1="393" x2="422" y2="427" class="pair"/><g data-strand="parental" data-sequence="ACGT" data-direction="5-to-3"><line x1="237" y1="370" x2="463" y2="370" class="backbone parental"/><g data-base="A" data-methylated="false"><rect x="258" y="348" width="40" height="44" rx="7" class="base parental-base "/><text x="278" y="381" class="base-letter" text-anchor="middle">A</text></g><g data-base="C" data-methylated="true"><rect x="306" y="348" width="40" height="44" rx="7" class="base parental-base modified"/><text x="326" y="381" class="base-letter" text-anchor="middle">C</text><line x1="326" y1="348" x2="326" y2="340" class="methyl-bond"/><text x="326" y="335" class="methyl small" text-anchor="middle">CH₃</text></g><g data-base="G" data-methylated="false"><rect x="354" y="348" width="40" height="44" rx="7" class="base parental-base "/><text x="374" y="381" class="base-letter" text-anchor="middle">G</text></g><g data-base="T" data-methylated="false"><rect x="402" y="348" width="40" height="44" rx="7" class="base parental-base "/><text x="422" y="381" class="base-letter" text-anchor="middle">T</text></g><text x="218" y="379" class="small" text-anchor="middle">5′</text><text x="482" y="379" class="small" text-anchor="middle">3′</text></g><g data-strand="parental" data-sequence="TGCA" data-direction="3-to-5"><line x1="237" y1="450" x2="463" y2="450" class="backbone parental"/><g data-base="T" data-methylated="false"><rect x="258" y="428" width="40" height="44" rx="7" class="base parental-base "/><text x="278" y="461" class="base-letter" text-anchor="middle">T</text></g><g data-base="G" data-methylated="false"><rect x="306" y="428" width="40" height="44" rx="7" class="base parental-base "/><text x="326" y="461" class="base-letter" text-anchor="middle">G</text></g><g data-base="C" data-methylated="true"><rect x="354" y="428" width="40" height="44" rx="7" class="base parental-base modified"/><text x="374" y="461" class="base-letter" text-anchor="middle">C</text><line x1="374" y1="472" x2="374" y2="489" class="methyl-bond"/><text x="374" y="511" class="methyl small" text-anchor="middle">CH₃</text></g><g data-base="A" data-methylated="false"><rect x="402" y="428" width="40" height="44" rx="7" class="base parental-base "/><text x="422" y="461" class="base-letter" text-anchor="middle">A</text></g><text x="218" y="459" class="small" text-anchor="middle">3′</text><text x="482" y="459" class="small" text-anchor="middle">5′</text></g></g>
  <path d="M319 402H381L376 397M381 402L376 407 M381 420H319L324 415M319 420L324 425" class="cpg"/>
  <text x="350" y="548" class="small" text-anchor="middle">CpG runs 5′ → 3′ on each strand.</text>
  <text x="350" y="582" class="small" text-anchor="middle">Each marked C pairs with G.</text>
</g>
<g aria-label="Replication produces two daughter molecules">
  <path d="M350 602V619L190 649V659" class="flow" marker-end="url(#arrow)"/>
  <path d="M350 619L510 649V659" class="flow" marker-end="url(#arrow)"/>
</g>
<g aria-label="B. Immediately after replication">
  <text x="36" y="706" class="position" text-anchor="start">B</text><text x="72" y="706" class="heading" text-anchor="start">Immediately after replication</text>
  <text x="350" y="747" class="body strong" text-anchor="middle">Hemimethylated DNA</text>
  <text x="190" y="789" class="small" text-anchor="middle">Parent 1 + new</text>
  <text x="510" y="789" class="small" text-anchor="middle">New + parent 2</text>
  <g id="daughter-1-hemi" aria-label="Parental strand 1 above a new strand"><line x1="118" y1="883" x2="118" y2="917" class="pair"/><line x1="166" y1="883" x2="166" y2="917" class="pair"/><line x1="214" y1="883" x2="214" y2="917" class="pair"/><line x1="262" y1="883" x2="262" y2="917" class="pair"/><g data-strand="parental" data-sequence="ACGT" data-direction="5-to-3"><line x1="77" y1="860" x2="303" y2="860" class="backbone parental"/><g data-base="A" data-methylated="false"><rect x="98" y="838" width="40" height="44" rx="7" class="base parental-base "/><text x="118" y="871" class="base-letter" text-anchor="middle">A</text></g><g data-base="C" data-methylated="true"><rect x="146" y="838" width="40" height="44" rx="7" class="base parental-base modified"/><text x="166" y="871" class="base-letter" text-anchor="middle">C</text><line x1="166" y1="838" x2="166" y2="830" class="methyl-bond"/><text x="166" y="825" class="methyl small" text-anchor="middle">CH₃</text></g><g data-base="G" data-methylated="false"><rect x="194" y="838" width="40" height="44" rx="7" class="base parental-base "/><text x="214" y="871" class="base-letter" text-anchor="middle">G</text></g><g data-base="T" data-methylated="false"><rect x="242" y="838" width="40" height="44" rx="7" class="base parental-base "/><text x="262" y="871" class="base-letter" text-anchor="middle">T</text></g><text x="58" y="869" class="small" text-anchor="middle">5′</text><text x="322" y="869" class="small" text-anchor="middle">3′</text></g><g data-strand="new" data-sequence="TGCA" data-direction="3-to-5"><line x1="77" y1="940" x2="303" y2="940" class="backbone new"/><g data-base="T" data-methylated="false"><rect x="98" y="918" width="40" height="44" rx="7" class="base new-base "/><text x="118" y="951" class="base-letter" text-anchor="middle">T</text></g><g data-base="G" data-methylated="false"><rect x="146" y="918" width="40" height="44" rx="7" class="base new-base "/><text x="166" y="951" class="base-letter" text-anchor="middle">G</text></g><g data-base="C" data-methylated="false"><rect x="194" y="918" width="40" height="44" rx="7" class="base new-base "/><text x="214" y="951" class="base-letter" text-anchor="middle">C</text></g><g data-base="A" data-methylated="false"><rect x="242" y="918" width="40" height="44" rx="7" class="base new-base "/><text x="262" y="951" class="base-letter" text-anchor="middle">A</text></g><text x="58" y="949" class="small" text-anchor="middle">3′</text><text x="322" y="949" class="small" text-anchor="middle">5′</text></g></g>
  <g id="daughter-2-hemi" aria-label="New strand above parental strand 2"><line x1="438" y1="883" x2="438" y2="917" class="pair"/><line x1="486" y1="883" x2="486" y2="917" class="pair"/><line x1="534" y1="883" x2="534" y2="917" class="pair"/><line x1="582" y1="883" x2="582" y2="917" class="pair"/><g data-strand="new" data-sequence="ACGT" data-direction="5-to-3"><line x1="397" y1="860" x2="623" y2="860" class="backbone new"/><g data-base="A" data-methylated="false"><rect x="418" y="838" width="40" height="44" rx="7" class="base new-base "/><text x="438" y="871" class="base-letter" text-anchor="middle">A</text></g><g data-base="C" data-methylated="false"><rect x="466" y="838" width="40" height="44" rx="7" class="base new-base "/><text x="486" y="871" class="base-letter" text-anchor="middle">C</text></g><g data-base="G" data-methylated="false"><rect x="514" y="838" width="40" height="44" rx="7" class="base new-base "/><text x="534" y="871" class="base-letter" text-anchor="middle">G</text></g><g data-base="T" data-methylated="false"><rect x="562" y="838" width="40" height="44" rx="7" class="base new-base "/><text x="582" y="871" class="base-letter" text-anchor="middle">T</text></g><text x="378" y="869" class="small" text-anchor="middle">5′</text><text x="642" y="869" class="small" text-anchor="middle">3′</text></g><g data-strand="parental" data-sequence="TGCA" data-direction="3-to-5"><line x1="397" y1="940" x2="623" y2="940" class="backbone parental"/><g data-base="T" data-methylated="false"><rect x="418" y="918" width="40" height="44" rx="7" class="base parental-base "/><text x="438" y="951" class="base-letter" text-anchor="middle">T</text></g><g data-base="G" data-methylated="false"><rect x="466" y="918" width="40" height="44" rx="7" class="base parental-base "/><text x="486" y="951" class="base-letter" text-anchor="middle">G</text></g><g data-base="C" data-methylated="true"><rect x="514" y="918" width="40" height="44" rx="7" class="base parental-base modified"/><text x="534" y="951" class="base-letter" text-anchor="middle">C</text><line x1="534" y1="962" x2="534" y2="979" class="methyl-bond"/><text x="534" y="1001" class="methyl small" text-anchor="middle">CH₃</text></g><g data-base="A" data-methylated="false"><rect x="562" y="918" width="40" height="44" rx="7" class="base parental-base "/><text x="582" y="951" class="base-letter" text-anchor="middle">A</text></g><text x="378" y="949" class="small" text-anchor="middle">3′</text><text x="642" y="949" class="small" text-anchor="middle">5′</text></g></g>
  <text x="350" y="1040" class="small" text-anchor="middle">Each daughter has one parental strand</text>
  <text x="350" y="1074" class="small" text-anchor="middle">and one initially unmethylated new strand.</text>
</g>
<line x1="36" y1="1101" x2="664" y2="1101" class="rule"/>
<g aria-label="C. Maintenance methylation">
  <text x="36" y="1147" class="position" text-anchor="start">C</text><text x="72" y="1147" class="heading" text-anchor="start">Maintenance methylation</text>
  <text x="36" y="1192" class="body strong" text-anchor="start">UHRF1</text><text x="135" y="1192" class="small" text-anchor="start">helps recognize these CpGs</text>
  <text x="135" y="1226" class="small" text-anchor="start">and recruit DNMT1.</text>
  <text x="36" y="1270" class="body strong" text-anchor="start">DNMT1</text><text x="135" y="1270" class="small" text-anchor="start">adds CH₃ to new-strand cytosines.</text>
  <text x="135" y="1304" class="small" text-anchor="start">New methyl groups come from a donor.</text>
  <path d="M190 1326V1352" class="flow" marker-end="url(#arrow)"/><path d="M510 1326V1352" class="flow" marker-end="url(#arrow)"/>
  <g id="daughter-1-restored" aria-label="Parental strand 1 above a new strand"><line x1="118" y1="1443" x2="118" y2="1477" class="pair"/><line x1="166" y1="1443" x2="166" y2="1477" class="pair"/><line x1="214" y1="1443" x2="214" y2="1477" class="pair"/><line x1="262" y1="1443" x2="262" y2="1477" class="pair"/><g data-strand="parental" data-sequence="ACGT" data-direction="5-to-3"><line x1="77" y1="1420" x2="303" y2="1420" class="backbone parental"/><g data-base="A" data-methylated="false"><rect x="98" y="1398" width="40" height="44" rx="7" class="base parental-base "/><text x="118" y="1431" class="base-letter" text-anchor="middle">A</text></g><g data-base="C" data-methylated="true"><rect x="146" y="1398" width="40" height="44" rx="7" class="base parental-base modified"/><text x="166" y="1431" class="base-letter" text-anchor="middle">C</text><line x1="166" y1="1398" x2="166" y2="1390" class="methyl-bond"/><text x="166" y="1385" class="methyl small" text-anchor="middle">CH₃</text></g><g data-base="G" data-methylated="false"><rect x="194" y="1398" width="40" height="44" rx="7" class="base parental-base "/><text x="214" y="1431" class="base-letter" text-anchor="middle">G</text></g><g data-base="T" data-methylated="false"><rect x="242" y="1398" width="40" height="44" rx="7" class="base parental-base "/><text x="262" y="1431" class="base-letter" text-anchor="middle">T</text></g><text x="58" y="1429" class="small" text-anchor="middle">5′</text><text x="322" y="1429" class="small" text-anchor="middle">3′</text></g><g data-strand="new" data-sequence="TGCA" data-direction="3-to-5"><line x1="77" y1="1500" x2="303" y2="1500" class="backbone new"/><g data-base="T" data-methylated="false"><rect x="98" y="1478" width="40" height="44" rx="7" class="base new-base "/><text x="118" y="1511" class="base-letter" text-anchor="middle">T</text></g><g data-base="G" data-methylated="false"><rect x="146" y="1478" width="40" height="44" rx="7" class="base new-base "/><text x="166" y="1511" class="base-letter" text-anchor="middle">G</text></g><g data-base="C" data-methylated="true"><rect x="194" y="1478" width="40" height="44" rx="7" class="base new-base modified"/><text x="214" y="1511" class="base-letter" text-anchor="middle">C</text><line x1="214" y1="1522" x2="214" y2="1539" class="methyl-bond"/><text x="214" y="1561" class="methyl small" text-anchor="middle">new CH₃</text></g><g data-base="A" data-methylated="false"><rect x="242" y="1478" width="40" height="44" rx="7" class="base new-base "/><text x="262" y="1511" class="base-letter" text-anchor="middle">A</text></g><text x="58" y="1509" class="small" text-anchor="middle">3′</text><text x="322" y="1509" class="small" text-anchor="middle">5′</text></g></g>
  <g id="daughter-2-restored" aria-label="New strand above parental strand 2"><line x1="438" y1="1443" x2="438" y2="1477" class="pair"/><line x1="486" y1="1443" x2="486" y2="1477" class="pair"/><line x1="534" y1="1443" x2="534" y2="1477" class="pair"/><line x1="582" y1="1443" x2="582" y2="1477" class="pair"/><g data-strand="new" data-sequence="ACGT" data-direction="5-to-3"><line x1="397" y1="1420" x2="623" y2="1420" class="backbone new"/><g data-base="A" data-methylated="false"><rect x="418" y="1398" width="40" height="44" rx="7" class="base new-base "/><text x="438" y="1431" class="base-letter" text-anchor="middle">A</text></g><g data-base="C" data-methylated="true"><rect x="466" y="1398" width="40" height="44" rx="7" class="base new-base modified"/><text x="486" y="1431" class="base-letter" text-anchor="middle">C</text><line x1="486" y1="1398" x2="486" y2="1390" class="methyl-bond"/><text x="486" y="1385" class="methyl small" text-anchor="middle">new CH₃</text></g><g data-base="G" data-methylated="false"><rect x="514" y="1398" width="40" height="44" rx="7" class="base new-base "/><text x="534" y="1431" class="base-letter" text-anchor="middle">G</text></g><g data-base="T" data-methylated="false"><rect x="562" y="1398" width="40" height="44" rx="7" class="base new-base "/><text x="582" y="1431" class="base-letter" text-anchor="middle">T</text></g><text x="378" y="1429" class="small" text-anchor="middle">5′</text><text x="642" y="1429" class="small" text-anchor="middle">3′</text></g><g data-strand="parental" data-sequence="TGCA" data-direction="3-to-5"><line x1="397" y1="1500" x2="623" y2="1500" class="backbone parental"/><g data-base="T" data-methylated="false"><rect x="418" y="1478" width="40" height="44" rx="7" class="base parental-base "/><text x="438" y="1511" class="base-letter" text-anchor="middle">T</text></g><g data-base="G" data-methylated="false"><rect x="466" y="1478" width="40" height="44" rx="7" class="base parental-base "/><text x="486" y="1511" class="base-letter" text-anchor="middle">G</text></g><g data-base="C" data-methylated="true"><rect x="514" y="1478" width="40" height="44" rx="7" class="base parental-base modified"/><text x="534" y="1511" class="base-letter" text-anchor="middle">C</text><line x1="534" y1="1522" x2="534" y2="1539" class="methyl-bond"/><text x="534" y="1561" class="methyl small" text-anchor="middle">CH₃</text></g><g data-base="A" data-methylated="false"><rect x="562" y="1478" width="40" height="44" rx="7" class="base parental-base "/><text x="582" y="1511" class="base-letter" text-anchor="middle">A</text></g><text x="378" y="1509" class="small" text-anchor="middle">3′</text><text x="642" y="1509" class="small" text-anchor="middle">5′</text></g></g>
  <text x="350" y="1610" class="body strong" text-anchor="middle">Methylation pattern restored</text>
</g>
<line x1="36" y1="1637" x2="664" y2="1637" class="rule"/>
<text x="350" y="1679" class="body" text-anchor="middle">The DNA sequence is copied.</text>
<text x="350" y="1714" class="body" text-anchor="middle">Maintenance helps preserve the pattern.</text>
</svg>